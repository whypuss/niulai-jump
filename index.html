      spawnMobBatch(count, zPos, mobType, hp, moveSpeed = 0.18) {
        const mat = mobType === 'shield'
          ? new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.4 })
          : (mobType === 'fast' ? new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 }) : new THREE.MeshStandardMaterial({ color: 0xd90429, roughness: 0.6 }));

        for (let i = 0; i < count; i++) {
          const g = new THREE.Group();
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.7), mat);
          body.position.y = 0.55;
          body.castShadow = true;
          g.add(body);

          if (mobType === 'shield') {
            const shieldMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6, roughness: 0.3 });
            const shield = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.2, 0.15), shieldMat);
            shield.position.set(0, 0.6, 0.45);
            g.add(shield);
          } else if (mobType === 'fast') {
            // 疾跑刺客小兵（頭頂雙角）
            const horn = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 4), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
            horn.position.set(0, 1.25, 0);
            g.add(horn);
          }

          const spread = Math.min(11, count * 1.3);
          const x = (i - (count - 1) / 2) * (spread / Math.max(1, count - 1)) + (Math.random() - 0.5) * 0.4;
          g.position.set(x, 0, zPos);
          this.scene.add(g);

          this.enemies.push({
            group: g,
            type: mobType,
            hp: hp,
            maxHp: hp,
            z: zPos,
            moveSpeed: moveSpeed, // 所有敵人都主動大步走過來！
            isMiniBoss: false
          });
        }
      }

            spawnActiveMiniBoss(zPos, bossType, hp, name, moveSpeed) {
        let model;
        if (bossType === 'leopard') model = createLeopardBossModel();
        else if (bossType === 'bull') model = createBigBullBossModel();
        else model = createGreenSnakeBossModel();

        model.position.set(0, 0, zPos);
        model.scale.multiplyScalar(0.85); // 小 Boss 體型為大 Boss 的 85%
        this.scene.add(model);

        this.enemies.push({
          group: model,
          type: 'active_miniboss',
          bossType: bossType,
          name: name,
          hp: hp,
          maxHp: hp,
          z: zPos,
          moveSpeed: moveSpeed, // 主動走過來！
          isMiniBoss: true
        });
      }

      spawnMiniBoss(zPos, hp) {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.4 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 1.6), mat);
        body.position.y = 1.1;
        body.castShadow = true;
        g.add(body);

        // 精英怪角與肩甲
        const shoulderMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.5, roughness: 0.3 });
        const sLeft = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), shoulderMat);
        sLeft.position.set(-1.0, 1.8, 0);
        const sRight = sLeft.clone();
        sRight.position.set(1.0, 1.8, 0);
        g.add(sLeft); g.add(sRight);

        g.position.set(0, 0, zPos);
        this.scene.add(g);

        this.enemies.push({
          group: g,
          type: 'miniboss',
          hp: hp,
          maxHp: hp,
          z: zPos,
          isMiniBoss: true
        });
      }

            spawnPickups(zPos) {
        const types = ['heal', 'ammo', 'gold', 'freeze', 'shield_buff', 'bomb'];
        const pType = types[Math.floor(Math.random() * types.length)];
        const xPos = (Math.random() - 0.5) * 9.0;

        const g = new THREE.Group();
        g.position.set(xPos, 0.6, zPos);

        if (pType === 'heal') {
          // 醫療急救十字包 (+4 兵)
          const box = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
          const cross = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.28, 0.28), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.95, 0.28), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          g.add(box); g.add(cross); g.add(crossV);
        } else if (pType === 'ammo') {
          // 高能狂暴彈藥 (+25 發強武)
          const box = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.6 }));
          const orb = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
          orb.position.y = 0.7;
          g.add(box); g.add(orb);
        } else if (pType === 'freeze') {
          // 冰霜冰晶法球（全屏減速/凍結敵兵）
          const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.65, 0), new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: false }));
          crystal.position.y = 0.5;
          g.add(crystal);
        } else if (pType === 'shield_buff') {
          // 守護光環護盾球
          const shieldOrb = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshStandardMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.7 }));
          shieldOrb.position.y = 0.5;
          g.add(shieldOrb);
        } else if (pType === 'bomb') {
          // 震盪天火炸彈（立即引爆清除周邊敵人）
          const bomb = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 }));
          const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 6), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
          fuse.position.y = 0.55;
          bomb.position.y = 0.5;
          g.add(bomb); g.add(fuse);
        } else {
          // 戰意金幣符文 (+2 兵力)
          const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.15, 16), new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.85, roughness: 0.15 }));
          coin.rotation.x = Math.PI / 2;
          coin.position.y = 0.45;
          g.add(coin);
        }

        this.scene.add(g);
        this.pickups.push({
          group: g,
          type: pType,
          z: zPos,
          x: xPos,
          collected: false
        });
      }

      createDecisionPoint(zPos, config) {
        // 1. 中間實體厚石牆：阻止玩家橫跳兩邊通吃！
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const midWall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3.2, 14), wallMat);
        midWall.position.set(0, 1.6, zPos + 2);
        midWall.castShadow = true;
        this.scene.add(midWall);

        // 2. 左路門 (增兵 / 復活)
        const leftGate = this.createGateMesh(-4.2, zPos, config.left.text, 0x0088ff);
        this.scene.add(leftGate.group);

        // 3. 右路門/玻璃球
        let rightOrb = null;
        let rightGate = null;
        if (config.right.type === 'weapon_orb') {
          rightOrb = this.createWeaponOrbMesh(4.2, zPos, config.right);
          this.scene.add(rightOrb.group);
        } else {
          rightGate = this.createGateMesh(4.2, zPos, config.right.text, 0x10b981);
          this.scene.add(rightGate.group);
        }

        this.decisionSections.push({
          z: zPos,
          wall: midWall,
          leftGate: leftGate,
          leftConfig: config.left,
          rightOrb: rightOrb,
          rightGate: rightGate,
          rightConfig: config.right,
          resolved: false
        });
      }

      createGateMesh(x, z, text, colorHex) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);

        const frameMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const leftBar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.2, 8), frameMat);
        leftBar.position.set(-1.8, 1.6, 0);
        const rightBar = leftBar.clone();
        rightBar.position.set(1.8, 1.6, 0);
        const topBar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.6, 8), frameMat);
        topBar.rotation.z = Math.PI / 2;
        topBar.position.set(0, 3.2, 0);

        const curtainMat = new THREE.MeshBasicMaterial({
          color: colorHex,
          transparent: true,
          opacity: 0.35,
          side: THREE.DoubleSide
        });
        const curtain = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.0), curtainMat);
        curtain.position.set(0, 1.5, 0);

        group.add(leftBar); group.add(rightBar); group.add(topBar); group.add(curtain);

        // 標籤文字
        const canvas = document.createElement('canvas');
        canvas.width = 160; canvas.height = 80;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 80, 40);

        const tex = new THREE.CanvasTexture(canvas);
        const tag = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.3), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
        tag.position.set(0, 3.6, 0);
        group.add(tag);

        return { group: group, width: 3.6 };
      }

      createWeaponOrbMesh(x, z, config) {
        const group = new THREE.Group();
        group.position.set(x, 1.6, z);

        // 外層半透明帶 HP 的發光玻璃外殼
        const glassMat = new THREE.MeshPhysicalMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.55,
          roughness: 0.1,
          transmission: 0.8,
          thickness: 0.5
        });
        const glassSphere = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 24), glassMat);
        glassSphere.castShadow = true;
        group.add(glassSphere);

        // 內部懸浮發光武器核心模型
        const weaponCoreMat = new THREE.MeshStandardMaterial({
          color: config.weapon === 'fire' ? 0xff4500 : (config.weapon === 'rapid' ? 0x00f0ff : 0xa855f7),
          emissive: config.weapon === 'fire' ? 0xff2200 : (config.weapon === 'rapid' ? 0x0088ff : 0x6b21a8),
          emissiveIntensity: 0.6
        });
        const weaponCore = new THREE.Mesh(new THREE.OctahedronGeometry(0.7, 0), weaponCoreMat);
        group.add(weaponCore);

        // 頂部 HP 數字標籤
        const hpTagCanvas = document.createElement('canvas');
        hpTagCanvas.width = 160; hpTagCanvas.height = 64;
        const hpTagTex = new THREE.CanvasTexture(hpTagCanvas);
        const hpTagMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.0), new THREE.MeshBasicMaterial({ map: hpTagTex, transparent: true }));
        hpTagMesh.position.set(0, 2.0, 0);
        group.add(hpTagMesh);

        const orbObj = {
          group: group,
          glass: glassSphere,
          core: weaponCore,
          hpTagCanvas: hpTagCanvas,
          hpTagTex: hpTagTex,
          hp: config.hp,
          maxHp: config.hp,
          weapon: config.weapon,
          text: config.text,
          radius: 1.4,
          broken: false
        };

        this.updateOrbHpTag(orbObj);
        return orbObj;
      }

      updateOrbHpTag(orb) {
        const ctx = orb.hpTagCanvas.getContext('2d');
        ctx.clearRect(0, 0, 160, 64);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, 10, 140, 44);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, 140, 44);

        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${orb.hp} HP`, 80, 32);
        orb.hpTagTex.needsUpdate = true;
      }

      prepareFinalBoss(zPos) {
        const bosses = ['leopard', 'bull', 'snake'];
        this.bossType = bosses[Math.floor(Math.random() * bosses.length)];
        let bossName = "狂暴獵豹 大BOSS";
        if (this.bossType === 'leopard') {
          this.boss = createLeopardBossModel();
          this.bossMaxHp = 25000; // 超長厚實血條！
          bossName = "👑 萬獸主宰·狂暴獵豹 (大BOSS)";
        } else if (this.bossType === 'bull') {
          this.boss = createBigBullBossModel();
          this.bossMaxHp = 32000; // 超長厚實血條！
          bossName = "👑 崩山撼地·狂暴戰牛 (大BOSS)";
        } else {
          this.boss = createGreenSnakeBossModel();
          this.bossMaxHp = 28000; // 超長厚實血條！
          bossName = "👑 噬天化龍·幽冥青蛇 (大BOSS)";
        }
        this.bossHp = this.bossMaxHp;
        this.bossNameText.textContent = bossName;
        this.boss.position.set(0, 0, zPos);
        this.bossZ = zPos;
        this.boss.scale.multiplyScalar(1.4); // 大 Boss 更加遮天蔽日
        this.scene.add(this.boss);
      }

      triggerVolley() {
        // 依武器決定射擊模式
        let arrowCount = Math.min(Math.floor(this.armyCount * 0.7) + 3, 36);
        let arrowColor = 0x38bdf8;
        let damage = 25;
        let isPierce = false;
        let isFire = false;

        if (this.weaponBuff.type === 'rapid') {
          arrowColor = 0x00ffff;
          damage = 32;
        } else if (this.weaponBuff.type === 'pierce') {
          arrowColor = 0xa855f7;
          damage = 45;
          isPierce = true;
        } else if (this.weaponBuff.type === 'fire') {
          arrowColor = 0xff4500;
          damage = 60;
          isFire = true;
        }

        const arrowGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.9, 6);
        const arrowMat = new THREE.MeshBasicMaterial({ color: arrowColor });

        for (let i = 0; i < arrowCount; i++) {
          const arrow = new THREE.Mesh(arrowGeo, arrowMat);
          arrow.rotation.x = Math.PI / 2;

          const rx = this.armyCenterX + (Math.random() - 0.5) * (Math.sqrt(this.armyCount) * 0.65);
          const rz = -this.worldZ + (Math.random() - 0.5) * 1.8;
          arrow.position.set(rx, 1.2 + Math.random() * 0.4, rz - 0.5);

          this.scene.add(arrow);
          this.arrows.push({
            mesh: arrow,
            speed: 1.9,
            damage: damage,
            isPierce: isPierce,
            isFire: isFire,
            vx: (Math.random() - 0.5) * 0.04
          });
        }

        // 消耗彈藥/時間
        if (this.weaponBuff.ammo > 0) {
          this.weaponBuff.ammo--;
          if (this.weaponBuff.ammo <= 0) {
            this.weaponBuff = { type: 'normal', duration: 0, ammo: 0, name: '普通短弓' };
            this.rebuildArmyFormation();
            this.updateUI();
          }
        }

        sound.playLaser();
      }

      update(now) {
        if (!this.active) return;

        // 1. 部隊向前推進（如果還未進入 Boss 決戰死斗場）
        if (!this.bossStageActive) {
          this.worldZ += this.marchSpeed;
          this.soldierGroup.position.z = -this.worldZ;
          this.camera.position.z = -this.worldZ + 24;

          // 當推進到 Boss 決戰區 (Z: -195)
          if (this.boss && Math.abs(-this.worldZ - this.boss.position.z) < 45) {
            this.bossStageActive = true;
            sound.playBossAlarm();
          }
        }

        // 2. 玩家操控橫向走位
        // 如果在分岔石牆區，限制不能穿牆！
        let targetX = this.targetArmyX;
        for (let d of this.decisionSections) {
          const relZ = -this.worldZ - d.z;
          if (relZ > -7 && relZ < 7) {
            // 在石牆區域：左側限制在 [-7, -0.6]，右側限制在 [0.6, 7]
            if (this.armyCenterX < 0) {
              targetX = Math.min(-0.6, targetX);
            } else {
              targetX = Math.max(0.6, targetX);
            }
          }
        }

        this.armyCenterX += (targetX - this.armyCenterX) * 0.22;
        this.soldierGroup.position.x = this.armyCenterX;
        this.camera.position.x = this.armyCenterX * 0.35;

        // 士兵集體踏步動態
        const marchTime = now * 0.012;
        this.soldiers.forEach((s, idx) => {
          s.position.y = Math.abs(Math.sin(marchTime + idx * 0.3)) * 0.12;
        });

        // 3. 旋轉武器玻璃球內的核心
        this.decisionSections.forEach(d => {
          if (d.rightOrb && !d.rightOrb.broken) {
            d.rightOrb.core.rotation.x += 0.03;
            d.rightOrb.core.rotation.y += 0.04;
          }
        });

        // 4. 定時齊射（攻速受連發弓 Buff 影響）
        let interval = this.baseVolleyInterval;
        if (this.weaponBuff.type === 'rapid') interval *= 0.5;

        if (now - this.lastVolleyTime > interval) {
          this.triggerVolley();
          this.lastVolleyTime = now;
        }

        // 檢查限時武器過期
        if (this.weaponBuff.duration > 0 && now > this.weaponBuff.duration) {
          this.weaponBuff = { type: 'normal', duration: 0, ammo: 0, name: '普通短弓' };
          this.rebuildArmyFormation();
          this.updateUI();
        }

        // 5. 二選一門與觸發檢測
        this.decisionSections.forEach(d => {
          if (!d.resolved) {
            const currentZ = -this.worldZ;
            if (Math.abs(currentZ - d.z) < 1.6) {
              // 踩中左路門
              if (this.armyCenterX < -1.5) {
                d.resolved = true;
                this.applyReward(d.leftConfig);
                sound.playPerfect(3);
                d.leftGate.group.visible = false;
                if (d.rightOrb) d.rightOrb.group.visible = false;
                if (d.rightGate) d.rightGate.group.visible = false;
              }
              // 踩中右路普通門
              else if (this.armyCenterX > 1.5 && d.rightGate) {
                d.resolved = true;
                this.applyReward(d.rightConfig);
                sound.playPerfect(3);
                d.leftGate.group.visible = false;
                d.rightGate.group.visible = false;
              }
            }
          }
        });

        // 6. 箭矢飛行與命中檢測
        for (let i = this.arrows.length - 1; i >= 0; i--) {
          const a = this.arrows[i];
          a.mesh.position.z -= a.speed;
          a.mesh.position.x += a.vx;

          let removeArrow = false;

          // (A) 檢測是否射中武器玻璃球
          for (let d of this.decisionSections) {
            const orb = d.rightOrb;
            if (orb && !orb.broken) {
              const oDist = Math.hypot(a.mesh.position.x - orb.group.position.x, a.mesh.position.z - orb.group.position.z);
              if (oDist < orb.radius) {
                orb.hp -= a.damage;
                this.showDamageText(a.damage, orb.group.position);
                this.updateOrbHpTag(orb);

                if (orb.hp <= 0) {
                  // 射破玻璃球！取得武器！
                  orb.broken = true;
                  this.scene.remove(orb.group);
                  this.applyWeapon(orb.weapon);
                  this.showBuffPopup("獲得：" + orb.text + "！", orb.group.position);
                  sound.playWinFanfare();
                }
                removeArrow = !a.isPierce;
                break;
              }
            }
          }

          // (B) 檢測是否射中敵方小兵/盾兵/精英怪
          if (!removeArrow) {
            for (let j = this.enemies.length - 1; j >= 0; j--) {
              const e = this.enemies[j];
              const dist = Math.hypot(a.mesh.position.x - e.group.position.x, a.mesh.position.z - e.group.position.z);
              if (dist < (e.isMiniBoss ? 1.8 : 0.9)) {
                // 盾兵正面減傷 (除非穿透或火焰)
                let actualDmg = a.damage;
                if (e.type === 'shield' && !a.isPierce && !a.isFire) {
                  actualDmg = Math.floor(actualDmg * 0.35); // 巨盾減傷 65%
                }

                e.hp -= actualDmg;
                this.showDamageText(actualDmg, e.group.position, a.isFire || a.isPierce);

                if (e.hp <= 0) {
                  this.scene.remove(e.group);
                  this.enemies.splice(j, 1);
                  sound.playExplode();
                }
                removeArrow = !a.isPierce;
                if (removeArrow) break;
              }
            }
          }

          // (C) 檢測是否命中最終 Boss
          if (!removeArrow && this.boss) {
            const bDist = Math.hypot(a.mesh.position.x - this.boss.position.x, a.mesh.position.z - this.boss.position.z);
            if (bDist < 3.4) {
              this.bossHp -= a.damage;
              this.showDamageText(a.damage, a.mesh.position, true);
              this.updateUI();
              removeArrow = !a.isPierce;

              if (this.bossHp <= 0) {
                this.winBossFight();
                return;
              }
            }
          }

          // 飛出射程
          if (removeArrow || a.mesh.position.z < -this.worldZ - 60) {
            this.scene.remove(a.mesh);
            this.arrows.splice(i, 1);
          }
        }

        // 7. 敵兵壓境傷害 (必須嚴格進行 X 軸與 Z 軸實體碰撞箱檢測，且只有在軍團寬度範圍內才會撞到)
        const armyFrontZ = -this.worldZ;
        const armyRadius = Math.max(1.2, Math.sqrt(this.armyCount) * 0.45);
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const e = this.enemies[i];
          const distZ = Math.abs(e.group.position.z - armyFrontZ);
          const distX = Math.abs(e.group.position.x - this.armyCenterX);

          // 只有當敵怪正面衝撞進軍團方陣半徑內
          if (distZ < 1.0 && distX < armyRadius + 0.5) {
            const lost = e.isMiniBoss ? 3 : (e.type === 'shield' ? 2 : 1);
            this.armyCount = Math.max(0, this.armyCount - lost);
            this.scene.remove(e.group);
            this.enemies.splice(i, 1);
            this.rebuildArmyFormation();
            this.updateUI();
            sound.playFall();

            if (this.armyCount <= 0) {
              this.loseGame();
              return;
            }
          } else if (e.group.position.z > armyFrontZ + 8) {
            // 敵兵如果已經被軍團甩在身後，平穩移除，不扣兵
            this.scene.remove(e.group);
            this.enemies.splice(i, 1);
          }
        }

        // 所有敵怪（普通兵、盾兵、疾跑兵、小Boss）都大步迎面主動衝鋒！
        const nowMs = performance.now();
        for (let e of this.enemies) {
          const isFrozen = e.frozenUntil && e.frozenUntil > nowMs;
          if (!isFrozen && e.moveSpeed) {
            e.group.position.z += e.moveSpeed; // 大步朝玩家衝擊！
            // 踏步身體起伏動畫
            e.group.position.y = (e.type === 'shield' || e.type === 'normal' ? 0.55 : 0.6) + Math.abs(Math.sin(now * 0.015 + e.group.position.z)) * 0.15;
          }
          if (e.type === 'active_miniboss') {
            if (!isFrozen) e.group.position.x = Math.sin(now * 0.003 + e.z) * 2.6;
          } else if (e.type === 'fast') {
            if (!isFrozen) e.group.position.x += Math.sin(now * 0.008 + e.group.position.z) * 0.09;
          }
        }

        // 沿途物資箱 (pickups) 旋轉與拾取檢測
        const curZ = -this.worldZ;
        for (let i = this.pickups.length - 1; i >= 0; i--) {
          const p = this.pickups[i];
          p.group.rotation.y += 0.03;
          // 檢測軍團是否經過
          if (Math.abs(curZ - p.z) < 1.6 && Math.abs(this.armyCenterX - p.x) < 2.5) {
            if (p.type === 'heal') {
              this.armyCount += 4;
              if (this.armyCount > this.maxEverArmy) this.maxEverArmy = this.armyCount;
              this.showBuffPopup("醫療補給 +4 士兵！", p.group.position);
              sound.playPerfect(1);
            } else if (p.type === 'ammo') {
              if (this.weaponBuff.ammo > 0) this.weaponBuff.ammo += 25;
              else this.applyWeapon('rapid'); // 若無武器直接激活連發弓
              this.showBuffPopup("狂暴彈藥補充！", p.group.position);
              sound.playPerfect(2);
            } else if (p.type === 'freeze') {
              // 冰凍敵軍 3.5 秒
              this.enemies.forEach(e => { e.frozenUntil = performance.now() + 3500; });
              this.showBuffPopup("❄️ 全場敵軍冰凍 3.5秒！", p.group.position, '#00f0ff');
              sound.playWinFanfare();
            } else if (p.type === 'bomb') {
              // 炸彈清除前排怪物
              this.enemies.forEach(e => {
                if (Math.abs(e.group.position.z - curZ) < 30) {
                  e.hp -= 200;
                  this.showDamageText(200, e.group.position, true);
                }
              });
              this.showBuffPopup("💥 震盪天火炸裂！-200 HP", p.group.position, '#ff5500');
              sound.playExplode();
            } else {
              this.armyCount += 2;
              this.showBuffPopup("部隊士氣 +2！", p.group.position);
              sound.playPerfect(1);
            }
            this.scene.remove(p.group);
            this.pickups.splice(i, 1);
            this.rebuildArmyFormation();
            this.updateUI();
          } else if (p.z > curZ + 15) {
            // 超出視野後清理
            this.scene.remove(p.group);
            this.pickups.splice(i, 1);
          }
        }

        // 8. 最終大 BOSS 戰鬥：超長血條 + 主動大步踏碎大地走過來！
        if (this.bossStageActive && this.boss) {
          const sway = Math.sin(now * 0.003) * 3.5;
          this.boss.position.x = sway;
          // 大 Boss 邁開步伐主動逼近玩家！
          const currentArmyZ = -this.worldZ;
          if (this.boss.position.z < currentArmyZ - 12) {
            this.boss.position.z += 0.06; // 主動大步走過來！
            // 走動時身體起伏震顫
            this.boss.position.y = Math.abs(Math.sin(now * 0.008)) * 0.5;
          }

          // 揮擊衝擊波 (每隔 4.5 秒發動一次大地踐踏)
          if (now - this.bossLastAttackTime > 4500) {
            this.bossLastAttackTime = now;
            const lost = Math.max(1, Math.floor(this.armyCount * 0.08)); // 按比例扣除小部分兵力
            this.armyCount = Math.max(0, this.armyCount - lost);
            this.rebuildArmyFormation();
            this.updateUI();
            sound.playFall();
            this.showDamageText(`BOSS 踐踏震盪！-${lost}`, this.soldierGroup.position);

            if (this.armyCount <= 0) {
              this.loseGame();
              return;
            }
          }
        }
      }

      applyReward(config) {
        if (config.type === 'add_soldier') {
          this.armyCount += config.val;
          this.showBuffPopup(`+${config.val} 弓箭手`, this.soldierGroup.position);
        } else if (config.type === 'sub_soldier') {
          this.armyCount = Math.max(1, this.armyCount - config.val);
          this.showBuffPopup(`-${config.val} 兵力折損！`, this.soldierGroup.position, '#ef4444');
          sound.playFall();
        } else if (config.type === 'mult_soldier') {
          this.armyCount = Math.floor(this.armyCount * config.val);
          this.showBuffPopup(`×${config.val} 軍團暴增！`, this.soldierGroup.position, '#38bdf8');
          sound.playWinFanfare();
        } else if (config.type === 'div_soldier') {
          this.armyCount = Math.max(1, Math.floor(this.armyCount / config.val));
          this.showBuffPopup(`÷${config.val} 部隊分流！`, this.soldierGroup.position, '#f87171');
          sound.playFall();
        } else if (config.type === 'revive_ratio') {
          const dead = Math.max(0, this.maxEverArmy - this.armyCount);
          const revive = Math.max(4, Math.floor(dead * config.ratio));
          this.armyCount += revive;
          this.showBuffPopup(`復活 +${revive} 士兵！`, this.soldierGroup.position);
        }

        if (this.armyCount > this.maxEverArmy) this.maxEverArmy = this.armyCount;
        this.rebuildArmyFormation();
        this.updateUI();
      }

      applyWeapon(weaponType) {
        if (weaponType === 'rapid') {
          this.weaponBuff = {
            type: 'rapid',
            duration: performance.now() + 12000, // 持續 12 秒
            ammo: 0,
            name: '⚡ 連發疾風弓 (12s)'
          };
        } else if (weaponType === 'pierce') {
          this.weaponBuff = {
            type: 'pierce',
            duration: 0,
            ammo: 20, // 20 輪穿透箭
            name: '🎯 貫穿強弩 (20發)'
          };
        } else if (weaponType === 'fire') {
          this.weaponBuff = {
            type: 'fire',
            duration: 0,
            ammo: 15, // 15 輪烈焰箭
            name: '🔥 焚天烈焰箭 (15發)'
          };
        }
        this.rebuildArmyFormation();
        this.updateUI();
      }

      showDamageText(dmg, pos, isCrit = false) {
        const screenPos = pos.clone();
        screenPos.y += 1.6;
        screenPos.project(this.camera);

        const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

        const el = document.createElement('div');
        el.className = isCrit ? 'dmg-popup crit' : 'dmg-popup';
        el.textContent = typeof dmg === 'number' ? `-${dmg}` : dmg;
        el.style.left = `${x + (Math.random() - 0.5) * 30}px`;
        el.style.top = `${y + (Math.random() - 0.5) * 20}px`;
        document.body.appendChild(el);

        setTimeout(() => el.remove(), 400);
      }

      showBuffPopup(text, pos) {
        const el = document.createElement('div');
        el.className = 'buff-popup';
        el.textContent = text;
        el.style.left = `${window.innerWidth / 2}px`;
        el.style.top = `${window.innerHeight / 2}px`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
      }

      updateUI() {
        const pct = Math.max(0, Math.min(100, (this.bossHp / this.bossMaxHp) * 100));
        this.bossHpBar.style.width = `${pct}%`;
        this.bossHpText.textContent = `${Math.max(0, this.bossHp)} / ${this.bossMaxHp}`;
        
        let weaponInfo = this.weaponBuff.name;
        if (this.weaponBuff.ammo > 0) weaponInfo += ` [剩餘:${this.weaponBuff.ammo}]`;
        this.armyCountBadge.innerHTML = `🏹 部隊: <b>${this.armyCount}</b> | 武器: <span style="color:#fde047;">${weaponInfo}</span>`;
      }

      winBossFight() {
        this.active = false;
        sound.playWinFanfare();

        this.reviveNotice.textContent = "🏆 攻破敵陣！軍團原位復活！";
        this.reviveNotice.style.display = 'block';

        setTimeout(() => {
          this.uiLayer.style.display = 'none';
          document.getElementById('ui-overlay').style.display = 'flex';
          this.reviveNotice.style.display = 'none';
          this.game.reviveFromLord(this.savedBlockPos);
        }, 1200);
      }

      loseGame() {
        this.active = false;
        sound.playFall();
        this.uiLayer.style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'flex';
        this.game.finalizeGameOver();
      }
    }

    // ==========================================
    // 3. 多元化方塊產生系統
    class BlockFactory {
      constructor() {
        this.blockTypes = ['pink_gift', 'grey_dot', 'white_kitty', 'green_cylinder', 'wood_crate', 'gold_brick'];
      }

      createRandomBlock(index = 0) {
        const type = index === 0 ? 'pink_gift' : this.blockTypes[Math.floor(Math.random() * this.blockTypes.length)];
        const group = new THREE.Group();
        group.name = `Block_${index}_${type}`;

        const width = 2.4;
        const height = 1.4;
        const depth = 2.4;

        if (type === 'pink_gift') {
          // 圖一左方粉色禮品方塊：粉紅底色 + 十字緞帶 + 金色中心
          const boxMat = new THREE.MeshStandardMaterial({ color: 0xf8b4be, roughness: 0.45 });
          const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
          const mainBox = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), boxMat);
          mainBox.castShadow = true;
          mainBox.receiveShadow = true;
          group.add(mainBox);

          // 十字白色緞帶
          const ribbonX = new THREE.Mesh(new THREE.BoxGeometry(width + 0.02, height + 0.02, 0.45), ribbonMat);
          const ribbonZ = new THREE.Mesh(new THREE.BoxGeometry(0.45, height + 0.02, depth + 0.02), ribbonMat);
          ribbonX.receiveShadow = true;
          ribbonZ.receiveShadow = true;
          group.add(ribbonX);
          group.add(ribbonZ);

          // 頂部小蝴蝶結/中心白點
          const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.04, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
          dot.position.y = height / 2 + 0.025;
          group.add(dot);

        } else if (type === 'grey_dot') {
          // 圖一上方灰黑方塊：灰色分層 + 頂部中心小白點 (+2 分彩蛋)
          const baseMat = new THREE.MeshStandardMaterial({ color: 0x6e7681, roughness: 0.6 });
          const stripeMat = new THREE.MeshStandardMaterial({ color: 0x959da5, roughness: 0.5 });
          const mainBox = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), baseMat);
          mainBox.castShadow = true;
          mainBox.receiveShadow = true;
          group.add(mainBox);

          // 腰線淺色橫條
          const stripe = new THREE.Mesh(new THREE.BoxGeometry(width + 0.02, 0.4, depth + 0.02), stripeMat);
          group.add(stripe);

          // 頂面中心小白點
          const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.04, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          dot.position.y = height / 2 + 0.025;
          group.add(dot);

        } else if (type === 'white_kitty') {
          // 圖一右下角白色萌物表情方塊
          const whiteMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.4 });
          const mainBox = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), whiteMat);
          mainBox.castShadow = true;
          mainBox.receiveShadow = true;
          group.add(mainBox);

          // 萌系臉龐貼圖
          const canvas = document.createElement('canvas');
          canvas.width = 256; canvas.height = 256;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fafafa';
          ctx.fillRect(0, 0, 256, 256);
          // 眼睛
          ctx.fillStyle = '#222';
          ctx.beginPath(); ctx.arc(80, 110, 14, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(176, 110, 14, 0, Math.PI * 2); ctx.fill();
          // 腮紅
          ctx.fillStyle = '#ffb3ba';
          ctx.beginPath(); ctx.arc(55, 140, 18, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(201, 140, 18, 0, Math.PI * 2); ctx.fill();
          // 貓咪笑嘴
          ctx.strokeStyle = '#222'; ctx.lineWidth = 6; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(114, 135, 16, 0.2, Math.PI - 0.2, false);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(142, 135, 16, 0.2, Math.PI - 0.2, false);
          ctx.stroke();

          const faceTex = new THREE.CanvasTexture(canvas);
          const faceMat = new THREE.MeshBasicMaterial({ map: faceTex });
          const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(width * 0.9, height * 0.9), faceMat);
          facePlane.position.set(width / 2 + 0.01, 0, 0);
          facePlane.rotation.y = Math.PI / 2;
          group.add(facePlane);

        } else if (type === 'green_cylinder') {
          // 圖一中間偏下綠色矮圓台
          const greenMat = new THREE.MeshStandardMaterial({ color: 0x48a979, roughness: 0.5 });
          const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(width * 0.55, width * 0.55, height, 32), greenMat);
          cylinder.castShadow = true;
          cylinder.receiveShadow = true;
          group.add(cylinder);

          // 頂面淺綠環圈
          const ring = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.6, 24), new THREE.MeshBasicMaterial({ color: 0x66c898, side: THREE.DoubleSide }));
          ring.rotation.x = -Math.PI / 2;
          ring.position.y = height / 2 + 0.02;
          group.add(ring);

        } else if (type === 'wood_crate') {
          // 經典木箱方塊
          const woodMat = new THREE.MeshStandardMaterial({ color: 0xc89d6c, roughness: 0.75 });
          const mainBox = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), woodMat);
          mainBox.castShadow = true;
          mainBox.receiveShadow = true;
          group.add(mainBox);

          // 邊框深色條
          const darkWood = new THREE.MeshStandardMaterial({ color: 0x8d6338, roughness: 0.8 });
          const frame = new THREE.Mesh(new THREE.BoxGeometry(width + 0.02, 0.12, depth + 0.02), darkWood);
          frame.position.y = height / 2 - 0.06;
          group.add(frame);

        } else {
          // 金磚方塊
          const goldMat = new THREE.MeshStandardMaterial({ color: 0xf5b722, metalness: 0.45, roughness: 0.3 });
          const mainBox = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), goldMat);
          mainBox.castShadow = true;
          mainBox.receiveShadow = true;
          group.add(mainBox);

          const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.03, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          dot.position.y = height / 2 + 0.02;
          group.add(dot);
        }

        // 方塊屬性
        group.userData = {
          width: width,
          height: height,
          depth: depth,
          radius: width / 2, // 判定半徑
          type: type
        };

        return group;
      }
    }

    // ==========================================
    // 4. 遊戲主控制器 (JumpGame Controller)
    // ==========================================
    class JumpGame {
      constructor() {
        this.container = document.getElementById('canvas-container');
        this.scoreEl = document.getElementById('current-score');
        this.highScoreEl = document.getElementById('high-score-display');
        this.instructionEl = document.getElementById('instruction-hint');
        this.chargeMeter = document.getElementById('charge-meter');
        this.chargeFill = document.getElementById('charge-fill');
        this.gameOverModal = document.getElementById('game-over-modal');
        this.modalScore = document.getElementById('modal-score');
        this.modalBest = document.getElementById('modal-best');

        this.score = 0;
        this.highScore = parseInt(localStorage.getItem('niulai_jump_best') || '0', 10);
        this.combo = 0; // 連續命中中心

        // 狀態機: IDLE, CHARGING, JUMPING, LANDED, GAMEOVER
        this.state = 'IDLE';

        this.chargeStartTime = 0;
        this.chargeRatio = 0; // 0 ~ 1

        this.blocks = [];
        this.currentBlockIndex = 0;
        this.nextDirection = new THREE.Vector3(1, 0, 0); // 隨機 X 或 Z 方向

        this.blockFactory = new BlockFactory();
        this.lordShooter = new ArmyArcherSiege(this);


        this.initThree();
        this.initLights();
        this.initCow();
        this.initFirstBlocks();
        this.initEvents();
        this.updateUI();

        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
      }

      initThree() {
        // 場景
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0xd0dbcc); // 經典跳一跳綠意背景
        this.scene.fog = new THREE.Fog(0xd0dbcc, 30, 70);

        // 正交相機 (Isometric Camera)
        const aspect = window.innerWidth / window.innerHeight;
        const d = 11;
        this.camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 100);
        
        // 經典 45度斜俯視角
        this.camera.position.set(16, 20, 16);
        this.camera.lookAt(0, 1.5, 0);
        this.cameraTarget = new THREE.Vector3(0, 1.5, 0);

        // 渲染器
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.container.appendChild(this.renderer.domElement);

        window.addEventListener('resize', () => {
          const asp = window.innerWidth / window.innerHeight;
          this.camera.left = -d * asp;
          this.camera.right = d * asp;
          this.camera.top = d;
          this.camera.bottom = -d;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      initLights() {
        // 環境半球光
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xb0bba8, 0.65);
        this.scene.add(hemiLight);

        // 主平行光（柔和投影）
        this.dirLight = new THREE.DirectionalLight(0xfff8ee, 0.75);
        this.dirLight.position.set(14, 25, 10);
        this.dirLight.castShadow = true;
        this.dirLight.shadow.mapSize.width = 2048;
        this.dirLight.shadow.mapSize.height = 2048;
        this.dirLight.shadow.camera.near = 1;
        this.dirLight.shadow.camera.far = 60;
        const size = 15;
        this.dirLight.shadow.camera.left = -size;
        this.dirLight.shadow.camera.right = size;
        this.dirLight.shadow.camera.top = size;
        this.dirLight.shadow.camera.bottom = -size;
        this.dirLight.shadow.bias = -0.0005;
        this.scene.add(this.dirLight);

        // 背景柔和補光
        const fillLight = new THREE.DirectionalLight(0xbad2c5, 0.3);
        fillLight.position.set(-15, 10, -15);
        this.scene.add(fillLight);
      }

      initCow() {
        this.cow = createNiulaiCowModel();
        this.scene.add(this.cow);
      }

      initFirstBlocks() {
        // 清理現有方塊
        for (let b of this.blocks) {
          this.scene.remove(b);
        }
        this.blocks = [];
        this.currentBlockIndex = 0;

        // 第一個起始方塊 (0, 0, 0)
        const b0 = this.blockFactory.createRandomBlock(0);
        b0.position.set(0, 0, 0);
        this.scene.add(b0);
        this.blocks.push(b0);

        // 小牛站在第一個方塊上
        const b0Height = b0.userData.height;
        this.cow.position.set(0, b0Height / 2 + 0.05, 0);
        this.cow.rotation.set(0, 0, 0);
        this.cow.scale.set(0.68, 0.68, 0.68);

        // 生成第二個方塊
        this.spawnNextBlock();
      }

      spawnNextBlock() {
        const lastBlock = this.blocks[this.blocks.length - 1];
        
        // 跳一跳經典：隨機前進方向，要麼 X 軸（右前），要麼 Z 軸（左前）
        const isX = Math.random() > 0.5;
        this.nextDirection = isX ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1);

        // 面向跳躍方向
        const targetRotY = isX ? 0 : -Math.PI / 2;
        this.cowTargetRotY = targetRotY;

        // 隨機跳躍距離 (4.2 ~ 7.8 單位)
        const distance = 4.2 + Math.random() * 3.6;
        const newPos = lastBlock.position.clone().add(this.nextDirection.clone().multiplyScalar(distance));

        const nextBlock = this.blockFactory.createRandomBlock(this.blocks.length);
        nextBlock.position.copy(newPos);
        nextBlock.position.y = -10; // 從下方升起的開場過渡
        this.scene.add(nextBlock);
        this.blocks.push(nextBlock);

        // 平滑升起動畫
        const targetY = 0;
        const startTime = performance.now();
        const riseAnim = (now) => {
          const t = Math.min((now - startTime) / 300, 1);
          const easeOut = Math.sin((t * Math.PI) / 2);
          nextBlock.position.y = -10 * (1 - easeOut) + targetY * easeOut;
          if (t < 1) requestAnimationFrame(riseAnim);
        };
        requestAnimationFrame(riseAnim);
      }

      initEvents() {
        const handleStart = (e) => {
          if (e.target.closest('#game-over-modal') || e.target.closest('.top-actions')) return;
          if (this.state !== 'IDLE') return;
          e.preventDefault();
          this.startCharge();
        };

        const handleEnd = (e) => {
          if (this.state !== 'CHARGING') return;
          e.preventDefault();
          this.releaseJump();
        };

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchend', handleEnd, { passive: false });

        // 重新開始
        document.getElementById('btn-restart').addEventListener('click', () => {
          this.restartGame();
        });

        // 聲音開關
        const soundBtn = document.getElementById('btn-sound-toggle');
        soundBtn.addEventListener('click', () => {
          sound.enabled = !sound.enabled;
          soundBtn.textContent = sound.enabled ? '🔊' : '🔇';
        });

        // 導出 GLB 檔案
        const exportGlb = () => {
          this.exportCowModel();
        };
        document.getElementById('btn-export-glb').addEventListener('click', exportGlb);
        document.getElementById('btn-modal-export').addEventListener('click', exportGlb);
      }

      startCharge() {
        this.state = 'CHARGING';
        this.chargeStartTime = performance.now();
        this.instructionEl.style.opacity = '0';
        this.chargeMeter.style.opacity = '1';
        this.chargeFill.style.width = '0%';
        sound.playChargeStart();
      }

      releaseJump() {
        if (this.state !== 'CHARGING') return;
        this.state = 'JUMPING';
        this.chargeMeter.style.opacity = '0';
        sound.playJump();

        const duration = (performance.now() - this.chargeStartTime) / 1000;
        // 蓄力比例（限制最大值 1.8 秒）
        const clampedDur = Math.min(Math.max(duration, 0.15), 1.7);
        this.jumpDistance = clampedDur * 5.2; // 係數

        this.jumpStartPos = this.cow.position.clone();
        this.jumpDir = this.nextDirection.clone();
        this.jumpTargetPos = this.jumpStartPos.clone().add(this.jumpDir.clone().multiplyScalar(this.jumpDistance));
        this.jumpStartTime = performance.now();
        this.jumpDuration = 480 + clampedDur * 120; // 飛行時間 ms

        // 恢復牛的身材比例並彈出
        const ud = this.cow.userData;
        if (ud && ud.bodyGroup) {
          ud.bodyGroup.scale.set(1.0, 1.35, 1.0); // 向上彈射拉伸感
        }
      }

      animateJump(now) {
        const elapsed = now - this.jumpStartTime;
        const progress = Math.min(elapsed / this.jumpDuration, 1);

        // 水平位移 (線性插值)
        this.cow.position.x = THREE.MathUtils.lerp(this.jumpStartPos.x, this.jumpTargetPos.x, progress);
        this.cow.position.z = THREE.MathUtils.lerp(this.jumpStartPos.z, this.jumpTargetPos.z, progress);

        // 垂直拋物線位移: 4 * h * p * (1 - p)
        const peakHeight = 2.6 + this.jumpDistance * 0.22;
        const heightArc = 4 * peakHeight * progress * (1 - progress);
        this.cow.position.y = this.jumpStartPos.y + heightArc;

        // 空中 360 度翻滾旋轉動畫 (經典跳一跳動作！)
        const rollAngle = progress * Math.PI * 2;
        if (this.jumpDir.x > 0.5) {
          // 向右前翻滾
          this.cow.rotation.z = -rollAngle;
          this.cow.rotation.x = 0;
        } else {
          // 向左前翻滾
          this.cow.rotation.x = -rollAngle;
          this.cow.rotation.z = 0;
        }

        // 跳躍完成，進入著陸判定
        if (progress >= 1) {
          this.cow.rotation.set(0, 0, 0); // 轉正
          this.checkLanding();
        }
      }

      checkLanding() {
        const cowX = this.cow.position.x;
        const cowZ = this.cow.position.z;

        const currentBlock = this.blocks[this.currentBlockIndex];
        const targetBlock = this.blocks[this.currentBlockIndex + 1];

        // 著陸目標檢測（可能是停留在原地，也可能是跳上了新方塊）
        const testLanding = (block) => {
          const bx = block.position.x;
          const bz = block.position.z;
          const radius = block.userData.radius || 1.2;
          const dist = Math.hypot(cowX - bx, cowZ - bz);
          return { landed: dist <= radius * 1.08, dist: dist, radius: radius };
        };

        const targetResult = testLanding(targetBlock);
        const currentResult = testLanding(currentBlock);

        if (targetResult.landed) {
          // 成功跳上下一個方塊！
          this.currentBlockIndex++;
          this.state = 'LANDED';
          sound.playLand();

          // 是否命中中心 (跳一跳經典機制)
          if (targetResult.dist < 0.38) {
            this.combo++;
            const addPoints = this.combo * 2;
            this.score += addPoints;
            sound.playPerfect(this.combo);
            this.showScorePopup(`+${addPoints}`, this.cow.position);
            this.createShockwave(targetBlock.position);
          } else {
            this.combo = 0;
            this.score += 1;
            this.showScorePopup('+1', this.cow.position);
          }

          this.updateUI();

          // 著陸 Squash 回彈動畫
          this.playLandBounce();

          // 相機跟隨滑動
          this.smoothMoveCameraTo(this.cow.position);

          // 生成下一個方塊
          this.spawnNextBlock();

          setTimeout(() => {
            if (this.state === 'LANDED') {
              this.state = 'IDLE';
            }
          }, 350);

        } else if (currentResult.landed && this.jumpDistance < 1.2) {
          // 跳得太短，落回原地方塊
          this.state = 'LANDED';
          sound.playLand();
          this.playLandBounce();
          setTimeout(() => {
            this.state = 'IDLE';
          }, 300);

        } else {
          // 掉出方塊外，失敗跌落！
          this.triggerGameOver(cowX, cowZ, targetBlock);
        }
      }

      playLandBounce() {
        const ud = this.cow.userData;
        if (!ud || !ud.bodyGroup) return;
        const start = performance.now();
        const anim = (now) => {
          const p = (now - start) / 250;
          if (p <= 1) {
            // 先壓扁後彈起恢復
            const squash = Math.sin(p * Math.PI) * 0.25;
            ud.bodyGroup.scale.set(1.0 + squash, 1.0 - squash, 1.0 + squash);
            requestAnimationFrame(anim);
          } else {
            ud.bodyGroup.scale.set(1, 1, 1);
          }
        };
        requestAnimationFrame(anim);
      }

      createShockwave(pos) {
        // 中心白色衝擊波環
        const ringGeo = new THREE.RingGeometry(0.1, 0.25, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(pos.x, 0.72, pos.z);
        this.scene.add(ring);

        const start = performance.now();
        const anim = (now) => {
          const t = (now - start) / 450;
          if (t <= 1) {
            const scale = 1 + t * 4;
            ring.scale.set(scale, scale, scale);
            ring.material.opacity = 0.9 * (1 - t);
            requestAnimationFrame(anim);
          } else {
            this.scene.remove(ring);
          }
        };
        requestAnimationFrame(anim);
      }

      showScorePopup(text, pos) {
        const screenPos = pos.clone();
        screenPos.y += 1.8;
        screenPos.project(this.camera);

        const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

        const el = document.createElement('div');
        el.className = 'score-popup';
        el.textContent = text;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        document.body.appendChild(el);

        setTimeout(() => el.remove(), 800);
      }

      smoothMoveCameraTo(targetPos) {
        this.cameraTarget.set(targetPos.x, 1.5, targetPos.z);
        // 相機平行移動
        this.cameraTargetPos = new THREE.Vector3(targetPos.x + 16, 20, targetPos.z + 16);
      }

      triggerGameOver(cowX, cowZ, nearestBlock) {
        this.state = 'FALLING_TO_LORD';
        sound.playFall();

        // 記錄失敗前所在的方塊位置（用於打贏後原地復活）
        const lastBlock = this.blocks[this.currentBlockIndex];
        this.lastSavedBlockPos = lastBlock ? lastBlock.position.clone() : new THREE.Vector3(0, 0, 0);

        // 摔落物理旋轉動畫，穿過虛空掉入《最強領主》世界
        const startY = this.cow.position.y;
        const start = performance.now();
        const fallAnim = (now) => {
          const t = (now - start) / 700;
          if (t <= 1) {
            this.cow.position.y = startY - t * t * 25;
            this.cow.rotation.x += 0.12;
            this.cow.rotation.z += 0.09;
            requestAnimationFrame(fallAnim);
          }
        };
        requestAnimationFrame(fallAnim);

        // 掉落深淵後無縫切換到《最強領主》割草射擊 Boss 戰
        setTimeout(() => {
          this.state = 'IN_LORD';
          this.lordShooter.start(this.lastSavedBlockPos);
        }, 750);
      }

      reviveFromLord(savedBlockPos) {
        // 領主戰獲勝！原位復活，繼續跳一跳！
        this.state = 'LANDED';
        const curBlock = this.blocks[this.currentBlockIndex];
        const blockY = curBlock ? curBlock.userData.height / 2 + 0.05 : 0.75;

        this.cow.position.set(savedBlockPos.x, blockY + 6.0, savedBlockPos.z);
        this.cow.rotation.set(0, this.cowTargetRotY || 0, 0);

        // 從天而降霸氣著陸動畫
        const startFall = performance.now();
        const dropAnim = (now) => {
          const p = Math.min((now - startFall) / 400, 1);
          const easeOut = 1 - Math.pow(1 - p, 3);
          this.cow.position.y = (blockY + 6.0) * (1 - easeOut) + blockY * easeOut;
          if (p < 1) {
            requestAnimationFrame(dropAnim);
          } else {
            sound.playLand();
            this.playLandBounce();
            this.createShockwave(savedBlockPos);
            this.smoothMoveCameraTo(this.cow.position);
            setTimeout(() => {
              this.state = 'IDLE';
            }, 300);
          }
        };
        requestAnimationFrame(dropAnim);
      }

      finalizeGameOver() {
        // 《最強領主》也失敗了，觸發最終 GameOver
        this.state = 'GAMEOVER';
        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('niulai_jump_best', this.highScore.toString());
        }
        this.modalScore.textContent = this.score;
        this.modalBest.textContent = `歷史最佳: ${this.highScore}`;
        this.gameOverModal.style.display = 'flex';
      }

      restartGame() {
        this.gameOverModal.style.display = 'none';
        this.score = 0;
        this.combo = 0;
        this.updateUI();
        this.initFirstBlocks();
        this.cameraTarget.set(0, 1.5, 0);
        this.camera.position.set(16, 20, 16);
        this.cameraTargetPos = null;
        this.state = 'IDLE';
        this.instructionEl.style.opacity = '1';
      }

      updateUI() {
        this.scoreEl.textContent = this.score;
        this.highScoreEl.textContent = `最高紀錄: ${this.highScore}`;
      }

      exportCowModel() {
        if (!THREE.GLTFExporter) {
          alert('GLTFExporter 加載中，請稍後重試');
          return;
        }
        const exporter = new THREE.GLTFExporter();
        const exportTarget = this.cow.clone();
        exportTarget.position.set(0, 0, 0);
        exportTarget.rotation.set(0, 0, 0);
        exportTarget.scale.set(1, 1, 1);

        exporter.parse(
          exportTarget,
          (gltf) => {
            const blob = new Blob([gltf], { type: 'model/gltf-binary' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'niulai_cow_model.glb';
            link.click();
            URL.revokeObjectURL(link.href);
          },
          { binary: true }
        );
      }

      animate(now) {
        requestAnimationFrame(this.animate);

        // 待機小牛微呼吸
        const ud = this.cow.userData;
        if (this.state === 'IDLE' && ud) {
          const breath = Math.sin(now * 0.0035) * 0.03;
          this.cow.position.y = (this.blocks[this.currentBlockIndex].userData.height / 2 + 0.05) + breath * 0.5;
          if (ud.arms && ud.arms[0]) {
            ud.arms[0].rotation.x = Math.sin(now * 0.003) * 0.08;
            ud.arms[1].rotation.x = -Math.sin(now * 0.003) * 0.08;
          }
        }

        // 蓄力中壓扁動畫
        if (this.state === 'CHARGING' && ud && ud.bodyGroup) {
          const duration = (now - this.chargeStartTime) / 1000;
          const ratio = Math.min(duration / 1.6, 1);
          this.chargeFill.style.width = `${ratio * 100}%`;

          // 身體下沉壓扁
          const squashY = THREE.MathUtils.lerp(1.0, 0.62, ratio);
          const expandXZ = THREE.MathUtils.lerp(1.0, 1.25, ratio);
          ud.bodyGroup.scale.set(expandXZ, squashY, expandXZ);

          // 腳下方塊微凹陷
          const curBlock = this.blocks[this.currentBlockIndex];
          if (curBlock) {
            curBlock.scale.y = THREE.MathUtils.lerp(1.0, 0.88, ratio);
          }
        } else if (this.state !== 'JUMPING' && this.blocks[this.currentBlockIndex]) {
          this.blocks[this.currentBlockIndex].scale.y = 1.0;
        }

        // 跳躍中
        if (this.state === 'JUMPING') {
          this.animateJump(now);
        }

        // 相機平滑插值 Lerp 跟隨
        if (this.cameraTargetPos) {
          this.camera.position.lerp(this.cameraTargetPos, 0.08);
          const curLook = new THREE.Vector3();
          this.camera.getWorldDirection(curLook);
          this.camera.lookAt(this.cameraTarget);
        }

        // 如果在《最強領主》模式中，更新並渲染領主場景
        if (this.state === 'IN_LORD') {
          this.lordShooter.update(now);
          this.renderer.render(this.lordShooter.scene, this.lordShooter.camera);
        } else {
          // 跳一跳主場景渲染
          this.renderer.render(this.scene, this.camera);
        }
      }
    }

    // 啟動遊戲
    window.addEventListener('DOMContentLoaded', () => {
      window.game = new JumpGame();
    });
  </script>
</body>
</html>
